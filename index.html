<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 목록</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px;
      background: linear-gradient(160deg, #faf6ec 0%, #efe5cf 100%) fixed;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: #222;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    /* 카드 위쪽에 꽉 차게 붙는 그림 배너 */
    .banner {
      margin: -24px -24px 20px;
    }

    .banner img {
      display: block;
      width: 100%;
      aspect-ratio: 840 / 368;
      object-fit: cover;
    }

    .banner figcaption {
      padding: 6px 12px;
      font-size: 12px;
      color: #8a7a4a;
      background: #faf6e9;
      text-align: right;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 24px;
    }

    .input-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    #todo-input,
    #due-input {
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid #ccd;
      border-radius: 8px;
      font-family: inherit;
    }

    #todo-input {
      flex: 1 1 100%;
    }

    #due-input {
      flex: 1;
      color: #444;
    }

    #todo-input:focus,
    #due-input:focus {
      outline: none;
      border-color: #4a6cf7;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 14px;
    }

    #add-button {
      padding: 10px 16px;
      background: #4a6cf7;
      color: #fff;
      font-size: 16px;
    }

    #add-button:hover { background: #3957d6; }

    #todo-list {
      list-style: none;
      margin: 20px 0 0;
      padding: 0;
    }

    #todo-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
      word-break: break-all;
    }

    .todo-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .due {
      font-size: 13px;
      color: #888;
    }

    .due.today { color: #e67e00; font-weight: bold; }
    .due.overdue { color: #d33; font-weight: bold; }

    .delete-button {
      padding: 6px 10px;
      background: #ffe8e8;
      color: #d33;
      flex-shrink: 0;
    }

    .delete-button:hover { background: #ffd0d0; }

    #empty-message {
      margin-top: 20px;
      text-align: center;
      color: #999;
    }
  </style>
</head>

      <figcaption>구스타프 클림트, 〈키스〉 (1907–1908)</figcaption>

    <h1>할 일 목록</h1>

    <div class="input-row">
      <input id="todo-input" type="text" placeholder="할 일을 입력하세요">
      <input id="due-input" type="date" title="기한 (선택)">
      <button id="add-button">추가</button>
    </div>

    <ul id="todo-list"></ul>
    <p id="empty-message">할 일이 없습니다.</p>
  </div>

  <script>
    const input = document.getElementById("todo-input");
    const dueInput = document.getElementById("due-input");
    const addButton = document.getElementById("add-button");
    const list = document.getElementById("todo-list");
    const emptyMessage = document.getElementById("empty-message");

    // 목록이 비어 있으면 안내 문구를 보여준다
    function updateEmptyMessage() {
      emptyMessage.style.display = list.children.length === 0 ? "block" : "none";
    }

    // "2026-10-05" 같은 기한으로 표시 문구와 색상 종류를 만든다
    function describeDue(dueValue) {
      const [year, month, day] = dueValue.split("-").map(Number);
      const due = new Date(year, month - 1, day);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const diff = Math.round((due - today) / (1000 * 60 * 60 * 24));

      if (diff > 0) return { text: `기한: ${dueValue} (D-${diff})`, type: "" };
      if (diff === 0) return { text: `기한: ${dueValue} (D-Day)`, type: "today" };
      return { text: `기한: ${dueValue} (${-diff}일 지남)`, type: "overdue" };
    }

    function addTodo() {
      const text = input.value.trim();
      if (text === "") return;

      const item = document.createElement("li");

      const label = document.createElement("span");
      label.className = "todo-text";

      const title = document.createElement("span");
      title.textContent = text;
      label.append(title);

      if (dueInput.value) {
        const { text: dueText, type } = describeDue(dueInput.value);
        const dueLabel = document.createElement("span");
        dueLabel.className = "due " + type;
        dueLabel.textContent = dueText;
        label.append(dueLabel);
      }

      const deleteButton = document.createElement("button");
      deleteButton.className = "delete-button";
      deleteButton.textContent = "삭제";
      deleteButton.addEventListener("click", () => {
        item.remove();
        updateEmptyMessage();
      });

      item.append(label, deleteButton);
      list.append(item);

      input.value = "";
      dueInput.value = "";
      input.focus();
      updateEmptyMessage();
    }

    addButton.addEventListener("click", addTodo);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.isComposing) addTodo();
    });

    updateEmptyMessage();
  </script>
